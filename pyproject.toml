[project]
name = "blindsight"
version = "0.1.0"
description = "Blindsight: voice-guided property tours from CoStar 3D data"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "pillow>=11.3.0",
    "qrcode>=8.2",
    "uvicorn[standard]>=0.39.0",
    "websockets>=15.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: needs headless Chrome", "node: needs node"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-timeout>=2.4.0",
    "python-pptx>=1.0.2",
]
