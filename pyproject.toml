[project]
name = "blindsight-workspace"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["blindsight-server", "qrcode>=8.2"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server"]

[tool.uv.sources]
blindsight-server = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.9,<1", "pytest-timeout>=2.4", "python-pptx>=1.0.2"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "tests"]
asyncio_mode = "auto"
markers = ["browser: needs headless Chrome", "node: needs node"]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
