[project]
name = "blindsight-server"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "anyio>=4,<5",
  "ultralytics>=8.3,<9", "pillow>=11,<13", "numpy>=2,<3",
  "torch>=2.5,<3", "transformers>=4.46,<6",
  "websockets>=14,<17", "opencv-python>=4.10,<5",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server"]
package-dir = { server = "." }
